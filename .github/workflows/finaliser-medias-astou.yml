name: Finaliser medias Astou

on:
  push:
    paths:
      - '.github/workflows/finaliser-medias-astou.yml'

permissions:
  contents: write

jobs:
  finaliser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choisir le format le plus leger en premier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          changed = []
          picture_re = re.compile(r'<picture class="digiy-media-opt">(?P<body>.*?)</picture>', re.I|re.S)
          source_re = re.compile(r'<source type="image/(?P<type>avif|webp)" srcset="(?P<src>[^"]+)">', re.I)

          for html in Path('.').rglob('*.html'):
              if '.git' in html.parts:
                  continue
              s = html.read_text(encoding='utf-8')
              original = s

              def repl(m):
                  body = m.group('body')
                  sources = list(source_re.finditer(body))
                  if len(sources) < 2:
                      return m.group(0)

                  entries = []
                  for sm in sources[:2]:
                      src = sm.group('src')
                      path = (html.parent / src).resolve()
                      size = path.stat().st_size if path.exists() else 10**18
                      entries.append((size, sm.group(0)))

                  ordered = [tag for _, tag in sorted(entries, key=lambda x: x[0])]
                  body2 = body
                  for sm in reversed(sources[:2]):
                      body2 = body2[:sm.start()] + body2[sm.end():]
                  body2 = ''.join(ordered) + body2
                  return '<picture class="digiy-media-opt">' + body2 + '</picture>'

              s = picture_re.sub(repl, s)
              if s != original:
                  html.write_text(s, encoding='utf-8')
                  changed.append(str(html))

          print('Pages ajustees:', ', '.join(changed) if changed else 'aucune')
          PY

      - name: Publier finition Astou
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: servir le format le plus leger en priorite'
          git push
