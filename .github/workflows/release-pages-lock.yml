name: Clear Pages locks before final deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-pages-lock.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale and temporary Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -e
          cancel_one() {
            deployment="$1"
            code=$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/pages/deployments/${deployment}/cancel")
            cat /tmp/cancel.txt || true
            test "$code" = "204" || test "$code" = "404"
          }

          cancel_one 2093ae0ffb9cd597bc4432a0965115169ed58ed5
          sleep 10

          code=$(curl -sS -o /tmp/status.txt -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages/deployments/${CURRENT_SHA}")
          if [ "$code" = "200" ]; then
            cancel_one "$CURRENT_SHA"
          fi

          sleep 30
