name: Reset stuck Pages queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          api_headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          cancel_deployment() {
            local deployment_id="$1"
            local code
            code=$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}' \
              -X POST "${api_headers[@]}" \
              "https://api.github.com/repos/${REPO}/pages/deployments/${deployment_id}/cancel")
            cat /tmp/cancel-response.txt || true
            case "$code" in
              204|404) echo "Deployment ${deployment_id}: cancellation handled (HTTP ${code})." ;;
              *) echo "Deployment ${deployment_id}: cancel failed (HTTP ${code})."; exit 1 ;;
            esac
          }

          cancel_deployment '9b968107f22ce4b484be41e05ed89e402029c9dc'
          cancel_deployment '95dae70e096cb7a4cd6f25e9fef37d7180131665'

          echo "Waiting for the deployment created by this push, if any..."
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/current-status.json -w '%{http_code}' \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${REPO}/pages/deployments/${CURRENT_SHA}")
            if [ "$code" = "200" ]; then
              cat /tmp/current-status.json
              cancel_deployment "$CURRENT_SHA"
              break
            fi
            sleep 5
          done

          echo "Allowing GitHub Pages to release its internal lock..."
          sleep 10

      - name: Request a fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/build-response.json -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/pages/builds")
            cat /tmp/build-response.json || true
            if [ "$code" = "201" ]; then
              echo "Fresh Pages build requested successfully."
              exit 0
            fi
            echo "Pages build request returned HTTP ${code}; retrying..."
            sleep 5
          done
          echo "Unable to request a fresh Pages build."
          exit 1
