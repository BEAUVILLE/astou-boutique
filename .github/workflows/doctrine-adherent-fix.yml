name: Corriger carte Astou adhérente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow
      - name: Corriger la carte sans toucher au QR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          p=Path('ASTOU_BOUTIQUE_CARTE_VISITE_DIGIY.png')
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          im=Image.open(p).convert('RGB')
          if im.size != (1080,1920):
              raise SystemExit(f'Taille inattendue: {im.size}')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((20,1582,1060,1749),radius=24,fill=(246,239,225),outline=(218,204,178),width=2)
          d.rounded_rectangle((34,1604,48,1727),radius=7,fill=(181,132,30))
          def fit(text,maxw,start):
              size=start
              while size>14:
                  f=ImageFont.truetype(font_path,size)
                  b=d.textbbox((0,0),text,font=f)
                  if b[2]-b[0] <= maxw: return f,b
                  size-=1
              f=ImageFont.truetype(font_path,size); return f,d.textbbox((0,0),text,font=f)
          t1='ADHÉRENTE DIGIYLYFE'; f1,b=fit(t1,900,36)
          d.text(((1080-(b[2]-b[0]))/2,1610),t1,font=f1,fill=(20,73,48))
          t2='CONTACT DIRECT  ·  PAIEMENT DIRECT  ·  0 % COMMISSION DIGIYLYFE'; f2,b=fit(t2,930,27)
          d.text(((1080-(b[2]-b[0]))/2,1677),t2,font=f2,fill=(40,40,38))
          im.save(p,'PNG',optimize=True)
          PY
      - name: Commit et push
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/doctrine-adherent-fix.yml
          git add ASTOU_BOUTIQUE_CARTE_VISITE_DIGIY.png
          git commit -m 'Carte Astou : adhérente DIGIYLYFE'
          git pull --rebase origin main
          git push
