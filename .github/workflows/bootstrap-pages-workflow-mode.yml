name: Basculer Pages vers un workflow controle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-pages-workflow-mode.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Annuler les anciens verrous Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          cancel_one() {
            deployment="$1"
            code=$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/pages/deployments/${deployment}/cancel")
            cat /tmp/cancel.txt || true
            test "$code" = "204" || test "$code" = "404"
          }

          cancel_one c9934e03850e10620e7031cff365438938695992
          cancel_one a0422e4d775f7cf4dcefdc7905b43217fa22122e

      - name: Passer GitHub Pages en mode workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/pages-update.txt -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"build_type":"workflow"}')
          cat /tmp/pages-update.txt || true
          test "$code" = "204"

      - name: Annuler le dernier deploiement legacy de cette bascule
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -e
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/current.txt -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/pages/deployments/${CURRENT_SHA}")
            if [ "$code" = "200" ]; then
              cancel_code=$(curl -sS -o /tmp/current-cancel.txt -w '%{http_code}' \
                -X POST \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${REPO}/pages/deployments/${CURRENT_SHA}/cancel")
              cat /tmp/current-cancel.txt || true
              test "$cancel_code" = "204" || test "$cancel_code" = "404"
              exit 0
            fi
            sleep 5
          done
          echo "Aucun deploiement legacy n'a ete cree pour ce SHA."
