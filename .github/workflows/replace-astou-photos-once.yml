name: Remplacer les photos Astou Boutique une fois

on:
  push:
    paths:
      - '.github/workflows/replace-astou-photos-once.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les 7 photos Adobe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/astou/premium
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5ee105f8-3234-4960-9d75-65f829db3181' -o assets/astou/premium/hero-linge.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7daa5f24-da5d-46dd-bab1-ea2dc07ac1e5' -o assets/astou/premium/cat-draps.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:97adfa98-f3e4-40d1-ad71-f5d94be2a216' -o assets/astou/premium/cat-serviettes.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ab89d43b-9174-453e-a2dc-0c13f9958626' -o assets/astou/premium/cat-peignoirs.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fb42d383-50c1-4ec0-9c6c-798f3024f788' -o assets/astou/premium/cat-linge.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:01765efb-2d35-4064-a079-60de60dfc2f7' -o assets/astou/premium/cat-petite-cote.jpg
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:be7249c8-10ba-4f4b-9c37-63c56c90f364' -o assets/astou/premium/cat-villas.jpg

      - name: Vérifier les images
        shell: bash
        run: |
          set -euo pipefail
          for image in assets/astou/premium/{hero-linge,cat-draps,cat-serviettes,cat-peignoirs,cat-linge,cat-petite-cote,cat-villas}.jpg
          do
            test "$(od -An -tx1 -N2 "$image" | tr -d ' \n')" = "ffd8"
            test "$(tail -c 2 "$image" | od -An -tx1 | tr -d ' \n')" = "ffd9"
            file "$image" | grep -q 'JPEG image data'
          done
          file assets/astou/premium/hero-linge.jpg | grep -q '1200x900'

      - name: Pointer la vitrine vers les nouvelles photos
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -l 'assets/astou/premium/.*\.webp' -- '*.html' '*.js' || true)
          test -n "$files"
          perl -pi -e 's/hero-linge\.webp/hero-linge.jpg/g; s/cat-draps\.webp/cat-draps.jpg/g; s/cat-serviettes\.webp/cat-serviettes.jpg/g; s/cat-peignoirs\.webp/cat-peignoirs.jpg/g; s/cat-linge\.webp/cat-linge.jpg/g; s/cat-petite-cote\.webp/cat-petite-cote.jpg/g; s/cat-villas\.webp/cat-villas.jpg/g' $files
          if git grep -n -E 'assets/astou/premium/(hero-linge|cat-draps|cat-serviettes|cat-peignoirs|cat-linge|cat-petite-cote|cat-villas)\.webp' -- '*.html' '*.js'
          then
            echo 'Des références WebP restent présentes.'
            exit 1
          fi

      - name: Publier la vitrine améliorée
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/astou/premium/*.jpg '*.html' assets/astou/mobile/mobile.js
          git commit -m "Harmoniser les photos Astou Boutique avec Adobe"
          git push
