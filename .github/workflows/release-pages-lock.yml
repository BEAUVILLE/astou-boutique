name: Release Pages lock once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-pages-lock.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages/deployments/bdad0025958912505555f0e013aa910dc527949b/cancel")
          cat /tmp/cancel.txt || true
          test "$code" = "204" || test "$code" = "404"
          sleep 30

      - name: Request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/build.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages/builds")
          cat /tmp/build.txt || true
          test "$code" = "201"
