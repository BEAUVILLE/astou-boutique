name: Installer les visuels Astou

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-astou-visuals.yml'
      - 'assets/astou/cat-draps.webp.zip'
      - 'assets/astou/cat-serviettes.webp.zip'

permissions:
  contents: write

concurrency:
  group: astou-unpack-visuals
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Décompresser et installer les deux images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/astou/premium /tmp/astou-draps /tmp/astou-serviettes

          test -f assets/astou/cat-draps.webp.zip
          test -f assets/astou/cat-serviettes.webp.zip

          unzip -o assets/astou/cat-draps.webp.zip -d /tmp/astou-draps
          unzip -o assets/astou/cat-serviettes.webp.zip -d /tmp/astou-serviettes

          DRAPS_FILE="$(find /tmp/astou-draps -type f -iname '*.webp' | head -n 1)"
          SERVIETTES_FILE="$(find /tmp/astou-serviettes -type f -iname '*.webp' | head -n 1)"

          test -n "$DRAPS_FILE"
          test -n "$SERVIETTES_FILE"

          cp "$DRAPS_FILE" assets/astou/premium/cat-draps.webp
          cp "$SERVIETTES_FILE" assets/astou/premium/cat-serviettes.webp

          test "$(wc -c < assets/astou/premium/cat-draps.webp)" -gt 20000
          test "$(wc -c < assets/astou/premium/cat-serviettes.webp)" -gt 20000

          rm -f assets/astou/cat-draps.webp.zip
          rm -f assets/astou/cat-serviettes.webp.zip
          rm -f .github/workflows/unpack-astou-visuals.yml

      - name: Enregistrer le correctif sur main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git commit -m "Installer les nouveaux visuels Draps et Serviettes Astou"
          git push origin main
