name: Cancel stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: 9b968107f22ce4b484be41e05ed89e402029c9dc
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/pages-cancel-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages/deployments/${DEPLOYMENT_ID}/cancel")
          cat /tmp/pages-cancel-response.txt || true
          if [ "$http_code" != "204" ]; then
            echo "Cancel endpoint returned HTTP $http_code"
            exit 1
          fi
          echo "Stuck Pages deployment cancelled."
